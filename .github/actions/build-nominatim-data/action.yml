name: 'Build Nominatim Data'
description: 'Download converter, run import, and upload nominatim data as artifact'

inputs:
  config:
    description: 'Converter config file name (in import/config/ directory)'
    required: false
    default: 'converter-prod.json'
  suffix:
    description: 'Suffix for image name (e.g., -se for geocoder-nominatim-data-se)'
    required: false
    default: ''
  min_size_mb:
    description: 'Minimum accepted size of nominatim.ndjson.gz in MB'
    required: false
    default: '150'
  lantmateriet_user:
    description: 'Lantmäteriet Geotorget username (for Swedish address data)'
    required: false
  lantmateriet_pass:
    description: 'Lantmäteriet Geotorget password (for Swedish address data)'
    required: false
  workload_identity_provider:
    description: 'GCP Workload Identity Provider'
    required: true
  service_account:
    description: 'GCP Service Account'
    required: true
  latest_tag:
    description: 'Override the latest tag (default: "latest")'
    required: false
    default: 'latest'
  build_tag:
    description: 'Shared per-run build tag (produced by the _generate-tag.yml reusable workflow)'
    required: true

outputs:
  image_tag:
    description: 'The tag of the uploaded nominatim data image'
    value: ${{ steps.upload-nominatim-data.outputs.tag }}

runs:
  using: 'composite'
  steps:
    - name: Run create-nominatim-data.sh
      shell: bash
      env:
        LANTMATERIET_USER: ${{ inputs.lantmateriet_user }}
        LANTMATERIET_PASS: ${{ inputs.lantmateriet_pass }}
      run: ./import/create-nominatim-data.sh import/config/${{ inputs.config }} -z
      working-directory: photon

    - name: Generate stats summary
      shell: bash
      working-directory: photon
      run: |
        echo "### Nominatim Data" >> "$GITHUB_STEP_SUMMARY"

        if [ -f nominatim.ndjson.gz ] && [ -f nominatim.ndjson ]; then
          COMPRESSED_SIZE=$(du -h nominatim.ndjson.gz | cut -f1)
          RATIO=$(gzip -l nominatim.ndjson.gz  | tail -n 1 | awk '{print $3}')
          LINE_COUNT=$(wc -l < nominatim.ndjson | tr -d ' ')

          echo "**Size:** ${COMPRESSED_SIZE} (${RATIO}) • **Records:** ${LINE_COUNT}" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "❌ Required files not found" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Upload nominatim data
      id: upload-nominatim-data
      uses: ./.github/actions/upload-gcs-artifact
      with:
        prefix: nominatim-data${{ inputs.suffix }}
        file_path: photon/nominatim.ndjson.gz
        min_size_mb: ${{ inputs.min_size_mb }}
        tag: ${{ inputs.build_tag }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
        latest_tag: ${{ inputs.latest_tag }}
