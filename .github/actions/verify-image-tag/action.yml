name: 'Verify Docker Image Tag'
description: 'Fail early unless eu.gcr.io/entur-system-1287/<image_name>:<image_tag> exists and is a build tag'

inputs:
  image_name:
    description: 'Docker image name'
    required: true
  image_tag:
    description: 'Build tag, <branch>.<timestamp>-SHA<sha>'
    required: true
  workload_identity_provider:
    description: 'GCP Workload Identity Provider'
    required: true
  service_account:
    description: 'GCP Service Account'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Authenticate with GCP
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Verify image tag
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        "$GITHUB_ACTION_PATH/verify-tag.sh" eu.gcr.io/entur-system-1287 "$IMAGE_NAME" "$IMAGE_TAG"
        echo "**Image:** \`$IMAGE_NAME:$IMAGE_TAG\` exists" >> "$GITHUB_STEP_SUMMARY"
