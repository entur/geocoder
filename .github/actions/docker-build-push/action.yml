name: Docker Build and Push
description: 'Build <context>/Dockerfile and push eu.gcr.io/entur-system-1287/<image_name>:<tag>; fails if the tag already exists'

inputs:
  image_name:
    description: "Docker image name"
    required: true
  context:
    description: "Build context"
    default: "."
  build_args:
    description: "Build arguments (KEY=VALUE, one per line)"
  push:
    description: "Push image to registry"
    default: 'false'
  workload_identity_provider:
    description: 'GCP Workload Identity Provider'
    required: true
  service_account:
    description: 'GCP Service Account'
    required: true
  tag:
    description: 'Build tag to use; omitted, one is generated (the proxy, whose image is its only artifact)'
    required: false
    default: ''

outputs:
  image_tag:
    description: "Image tag"
    value: ${{ steps.set-tag.outputs.image_tag }}

runs:
  using: 'composite'
  steps:
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Authenticate with GCP
      if: ${{ inputs.push == 'true' }}
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Configure Docker for GCR
      shell: bash
      if: ${{ inputs.push == 'true' }}
      run: gcloud auth configure-docker eu.gcr.io --quiet

    - name: Set image tag
      id: set-tag
      shell: bash
      env:
        OVERRIDE: ${{ inputs.tag }}
        IMAGE_NAME: ${{ inputs.image_name }}
      run: |
        if [ -n "$OVERRIDE" ]; then
          TAG="$OVERRIDE"
        else
          TAG=$("$GITHUB_WORKSPACE/.github/scripts/generate-tag.sh" "$(git rev-parse HEAD)" "${GITHUB_REF_NAME:-detached}")
        fi
        echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "image=eu.gcr.io/entur-system-1287/$IMAGE_NAME" >> "$GITHUB_OUTPUT"

    - name: Check if image already exists
      if: ${{ inputs.push == 'true' }}
      shell: bash
      env:
        IMAGE: ${{ steps.set-tag.outputs.image }}:${{ steps.set-tag.outputs.image_tag }}
      run: |
        if gcloud container images describe "$IMAGE" > /dev/null 2>&1; then
          echo "::error::Image $IMAGE already exists in registry"
          exit 1
        fi

    - name: Build and push to GCR
      uses: docker/build-push-action@v7
      id: build-push
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/Dockerfile
        push: ${{ inputs.push }}
        tags: ${{ steps.set-tag.outputs.image }}:${{ steps.set-tag.outputs.image_tag }}
        build-args: ${{ inputs.build_args }}
        provenance: false

    - name: Write build and push summary
      shell: bash
      if: always()
      run: |
        echo "### Docker Build & Push Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "**In:** image_name=\`${{ inputs.image_name }}\` context=\`${{ inputs.context }}\` push=\`${{ inputs.push }}\` build_args=\`${{ inputs.build_args || 'none' }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "**Out:** image_tag=\`${{ steps.set-tag.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
