name: 'Acceptance Tests'
description: 'Run geocoder acceptance tests'

inputs:
  environment:
    description: 'Environment to test (dev, tst, prd)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout acceptance tests
      uses: actions/checkout@v6
      with:
        repository: entur/geocoder-acceptance-tests
        path: acceptance-tests

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: acceptance-tests/package-lock.json

    - name: Install test dependencies
      shell: bash
      working-directory: acceptance-tests
      run: npm install

    - name: Run acceptance tests
      id: tests
      shell: bash
      working-directory: acceptance-tests
      run: |
        set +e
        set -o pipefail
        npm run v2${{ inputs.environment }} 2>&1 | tee test-output.log
        TEST_EXIT_CODE=${PIPESTATUS[0]}
        echo "exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: test-results-v2${{ inputs.environment }}
        path: acceptance-tests/test-output.log
        retention-days: 30

    - name: Add test summary
      if: always()
      shell: bash
      working-directory: acceptance-tests
      run: |
        {
          echo "### Acceptance Test Results - v2${{ inputs.environment }}"
          echo ""
          echo "\`\`\`"
          grep -v 'Tests completed:' test-output.log
          echo "\`\`\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if tests failed
      if: always() && steps.tests.outputs.exit_code != '0'
      shell: bash
      run: |
        echo "Tests failed with exit code ${{ steps.tests.outputs.exit_code }}"
        exit 1
