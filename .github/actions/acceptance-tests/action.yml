name: 'Acceptance Tests'
description: 'Run geocoder acceptance tests'

inputs:
  environment:
    description: 'Environment to test (dev, tst, prd)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout acceptance tests
      uses: actions/checkout@v7
      with:
        repository: entur/geocoder-acceptance-tests
        path: acceptance-tests

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: acceptance-tests/package-lock.json

    - name: Install test dependencies
      shell: bash
      working-directory: acceptance-tests
      run: npm install

    - name: Run v2 acceptance tests
      id: v2
      shell: bash
      working-directory: acceptance-tests
      run: |
        set +e
        set -o pipefail
        npm run v2${{ inputs.environment }} 2>&1 | tee test-output-v2.log
        echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Run v3 acceptance tests
      id: v3
      shell: bash
      working-directory: acceptance-tests
      run: |
        set +e
        set -o pipefail
        npm run v3${{ inputs.environment }} 2>&1 | tee test-output-v3.log
        echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ inputs.environment }}
        path: acceptance-tests/test-output-v*.log
        retention-days: 30

    - name: Add test summary
      if: always()
      shell: bash
      working-directory: acceptance-tests
      run: |
        for suite in v2 v3; do
          {
            echo "### Acceptance Test Results - $suite${{ inputs.environment }}"
            echo ""
            echo "\`\`\`"
            grep -v 'Tests completed:' "test-output-$suite.log"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
        done

    - name: Fail if tests failed
      if: always() && (steps.v2.outputs.exit_code != '0' || steps.v3.outputs.exit_code != '0')
      shell: bash
      run: |
        echo "v2 exit ${{ steps.v2.outputs.exit_code }}, v3 exit ${{ steps.v3.outputs.exit_code }}"
        exit 1
