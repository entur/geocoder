name: Proxy — Build & Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - 'dev → tst → prd'
          - 'tst → prd'

concurrency:
  group: "proxy-${{ inputs.target }}"
  cancel-in-progress: true

jobs:
  log-inputs:
    name: Log Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Log manual inputs
        run: |
          echo "### Manual Workflow Inputs" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** \`${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"

  build-push:
    name: Proxy
    runs-on: ubuntu-latest
    timeout-minutes: 600
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Build Proxy image
        id: build
        uses: ./.github/actions/build-proxy-image
        with:
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  # --- Deploy ---

  deploy-dev:
    name: Dev
    needs: build-push
    if: inputs.target == 'dev → tst → prd'
    uses: ./.github/workflows/deploy-and-test.yml
    with:
      environment: dev
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
      values: values-kub-ent-dev.yaml
      require_approval: false
    secrets: inherit

  deploy-tst:
    name: Staging
    needs: [ build-push, deploy-dev ]
    if: |
      !cancelled() &&
      (inputs.target == 'tst → prd' || needs.deploy-dev.result == 'success')
    uses: ./.github/workflows/deploy-and-test.yml
    with:
      environment: tst
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
    secrets: inherit

  deploy-prd:
    name: Production
    needs: [ build-push, deploy-tst ]
    if: |
      !cancelled() &&
      needs.deploy-tst.result == 'success'
    uses: ./.github/workflows/deploy-and-test.yml
    with:
      environment: prd
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
    secrets: inherit

  notify-slack:
    needs: [ deploy-dev, deploy-tst, deploy-prd ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* (${{ inputs.target }}) failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
