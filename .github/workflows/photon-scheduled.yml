name: Photon — Scheduled Import

on:
  schedule:
    # Run full build every day (6:27 UTC is 7:27 CET or 8:27 CEST)
    - cron: '27 6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to build (default: whatever prd is running)'
        required: false
        type: string

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

# Builds the commit behind photon-data/latest-prod.txt, which the prd deploy moves after
# acceptance tests pass, so the unattended run never picks up untested main.
# The deploy jobs still check out the workflow ref, so chart and tests come from main.

jobs:
  resolve-prod-ref:
    name: Resolve Prod Ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve ref from the build running in prd
        id: resolve
        shell: bash
        env:
          OVERRIDE: ${{ inputs.ref }}
          POINTER: https://storage.googleapis.com/ent-geocoder-prd/photon-data/latest-prod.txt
        run: |
          if [ -n "$OVERRIDE" ]; then
            SOURCE="workflow_dispatch input"
            SHORT="$OVERRIDE"
          else
            SOURCE=$(curl -fsSL --retry 3 --retry-delay 5 -A entur-geocoder "$POINTER" | tr -d '[:space:]')
            SHORT=$(./.github/scripts/resolve-prod-ref.sh "$SOURCE")
          fi

          # actions/checkout needs the full SHA, and an empty ref would silently
          # fall back to main.
          REF=$(git rev-parse "${SHORT}^{commit}")

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          {
            echo "### Prod Ref"
            echo "**Source:** \`$SOURCE\`"
            echo "**Building from:** \`$REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

  generate-tag:
    name: Generate Tag
    needs: resolve-prod-ref
    uses: ./.github/workflows/_generate-tag.yml
    with:
      ref: ${{ needs.resolve-prod-ref.outputs.ref }}

  nominatim-data:
    name: Nominatim Data
    needs: [resolve-prod-ref, generate-tag]
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-prod-ref.outputs.ref }}
      - name: Build nominatim data
        id: build
        uses: ./.github/actions/build-nominatim-data
        with:
          build_tag: ${{ needs.generate-tag.outputs.tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  photon:
    name: Photon Image
    needs: [resolve-prod-ref, generate-tag, nominatim-data]
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-prod-ref.outputs.ref }}
      - name: Build Photon image
        id: build
        uses: ./.github/actions/build-photon-image
        with:
          nominatim_data_tag: ${{ needs.nominatim-data.outputs.image_tag }}
          build_tag: ${{ needs.generate-tag.outputs.tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy-tst:
    name: Staging
    needs: photon
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: tst
      image: "geocoder-photon:${{ needs.photon.outputs.image_tag }}"
      chart: helm/geocoder-photon
      namespace: geocoder
      release_name: geocoder-photon
      values: values-kub-ent-tst.yaml
      photon_data_prefix: photon-data
      require_approval: false
    secrets: inherit

  deploy-prd:
    name: Prod
    needs: [ photon, deploy-tst ]
    if: |
      !cancelled() &&
      needs.deploy-tst.result == 'success'
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: prd
      image: "geocoder-photon:${{ needs.photon.outputs.image_tag }}"
      chart: helm/geocoder-photon
      namespace: geocoder
      release_name: geocoder-photon
      values: values-kub-ent-prd.yaml
      photon_data_prefix: photon-data
      require_approval: false
    secrets: inherit

  notify-slack:
    needs: [ resolve-prod-ref, generate-tag, nominatim-data, photon, deploy-tst, deploy-prd ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
