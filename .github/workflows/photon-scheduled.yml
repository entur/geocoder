name: Photon — Scheduled Import

on:
  schedule:
    # Run the import every day (6:27 UTC is 7:27 CET or 8:27 CEST)
    - cron: '27 6 * * *'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Photon build tag to refresh the data for. Supplying one also deploys that image, so tst and prd then need approval. Default: whatever prd runs.'
        required: false
        type: string

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

# Refreshes the index without rebuilding the image: the pods fetch photon_data.tar.gz at
# startup, so a helm upgrade that only moves PHOTON_DATA_URL rolls them onto new data.
# The import jobs check out the commit prd's image was built from, so jar, converter, flags
# and build actions are the ones that produced that image and untested main never runs
# unattended. prd's image tag only moves when a human promotes, and so does this.
# The deploy jobs check out the workflow ref, so chart and tests come from main.

jobs:
  resolve-prod-release:
    name: Resolve Prod Release
    uses: ./.github/workflows/_resolve-release.yml
    with:
      environment: prd
      release_name: geocoder-photon
      image_tag: ${{ inputs.image_tag }}

  generate-tag:
    name: Generate Tag
    needs: resolve-prod-release
    uses: ./.github/workflows/_generate-tag.yml
    with:
      ref: ${{ needs.resolve-prod-release.outputs.ref }}

  nominatim-data:
    name: Nominatim Data
    needs: [resolve-prod-release, generate-tag]
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-prod-release.outputs.ref }}
      - name: Build nominatim data
        id: build
        uses: ./.github/actions/build-nominatim-data
        with:
          build_tag: ${{ needs.generate-tag.outputs.tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  photon-data:
    name: Photon Data
    needs: [resolve-prod-release, generate-tag, nominatim-data]
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      contents: read
      id-token: write
    outputs:
      data_tag: ${{ steps.build.outputs.data_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-prod-release.outputs.ref }}
      - name: Build Photon data
        id: build
        uses: ./.github/actions/build-photon-data
        with:
          nominatim_data_tag: ${{ needs.nominatim-data.outputs.image_tag }}
          build_tag: ${{ needs.generate-tag.outputs.tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy-tst:
    name: Staging
    needs: [resolve-prod-release, photon-data]
    # tst gets prd's image too, so the tests run against the same jar prd will use.
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: tst
      image: "geocoder-photon:${{ needs.resolve-prod-release.outputs.image_tag }}"
      photon_data_tag: ${{ needs.photon-data.outputs.data_tag }}
      chart: helm/geocoder-photon
      release_name: geocoder-photon
      photon_data_prefix: photon-data
      # Unattended for the cron path, which never moves prd's image. Supplying
      # image_tag makes this a promote, so gate it like photon-deploy.yml does.
      require_approval: ${{ inputs.image_tag != '' }}
    secrets: inherit

  deploy-prd:
    name: Prod
    needs: [resolve-prod-release, photon-data, deploy-tst]
    if: |
      !cancelled() &&
      needs.deploy-tst.result == 'success'
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: prd
      image: "geocoder-photon:${{ needs.resolve-prod-release.outputs.image_tag }}"
      photon_data_tag: ${{ needs.photon-data.outputs.data_tag }}
      chart: helm/geocoder-photon
      release_name: geocoder-photon
      photon_data_prefix: photon-data
      require_approval: ${{ inputs.image_tag != '' }}
    secrets: inherit

  notify-slack:
    needs: [ resolve-prod-release, generate-tag, nominatim-data, photon-data, deploy-tst, deploy-prd ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
