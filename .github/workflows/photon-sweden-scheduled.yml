name: Photon Sweden — Scheduled Import

on:
  schedule:
    # Weekly (5:27 UTC is 6:27 CET or 7:27 CEST). Kept ahead of the Norway import at 6:27
    # UTC so the two don't compete for the 8-core runner group. Monday so a failure
    # notification lands before the working week rather than over the weekend.
    - cron: '27 5 * * 1'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Photon Sweden build tag to refresh the data for. Supplying one also deploys that image. Default: whatever dev runs.'
        required: false
        type: string

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

# Same shape as photon-scheduled.yml, for dev only: refreshes the index under the image dev
# already runs, so a merge to main reaches Sweden only through photon-sweden.yml. The weekly
# run also keeps photon-data-se/ inside the bucket's 90-day lifecycle window; without it the
# deployed image outlives its photon_data.tar.gz and the pod can no longer start after a restart.

jobs:
  resolve-dev-release:
    name: Resolve Dev Release
    uses: ./.github/workflows/_resolve-release.yml
    with:
      environment: dev
      release_name: geocoder-photon-se
      image_tag: ${{ inputs.image_tag }}
      promote_with: photon-sweden.yml

  generate-tag:
    name: Generate Tag
    needs: resolve-dev-release
    uses: ./.github/workflows/_generate-tag.yml
    with:
      ref: ${{ needs.resolve-dev-release.outputs.ref }}

  nominatim-data:
    name: Nominatim Data
    needs: [resolve-dev-release, generate-tag]
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-dev-release.outputs.ref }}
      - name: Build nominatim data
        id: build
        uses: ./.github/actions/build-nominatim-data
        with:
          config: converter-sweden-test.json
          suffix: -se
          build_tag: ${{ needs.generate-tag.outputs.tag }}
          lantmateriet_user: ${{ secrets.LANTMATERIET_USER }}
          lantmateriet_pass: ${{ secrets.LANTMATERIET_PASS }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  photon-data:
    name: Photon Data
    needs: [resolve-dev-release, generate-tag, nominatim-data]
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      contents: read
      id-token: write
    outputs:
      data_tag: ${{ steps.build.outputs.data_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-dev-release.outputs.ref }}
      - name: Build Photon data
        id: build
        uses: ./.github/actions/build-photon-data
        with:
          nominatim_data_tag: ${{ needs.nominatim-data.outputs.image_tag }}
          suffix: -se
          build_tag: ${{ needs.generate-tag.outputs.tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy-dev:
    name: Dev
    needs: [resolve-dev-release, photon-data]
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: dev
      image: "geocoder-photon-se:${{ needs.resolve-dev-release.outputs.image_tag }}"
      photon_data_tag: ${{ needs.photon-data.outputs.data_tag }}
      chart: helm/geocoder-photon
      namespace: geocoder
      release_name: geocoder-photon-se
      values: values-kub-ent-dev-se.yaml
      photon_data_prefix: photon-data-se
      require_approval: false
      run_tests: false
    secrets: inherit

  notify-slack:
    needs: [ resolve-dev-release, generate-tag, nominatim-data, photon-data, deploy-dev ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
