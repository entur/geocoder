name: Photon — Import, Build & Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - 'dev only'
          - 'dev → tst → prd'
          - 'tst → prd'
      config:
        description: 'Nominatim config'
        required: false
        type: string
        default: 'sources-prod.conf'

concurrency:
  group: "${{ github.workflow }}-${{ inputs.target }}"
  cancel-in-progress: true

jobs:
  log-inputs:
    name: Log Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Log manual inputs
        run: |
          {
            echo "### Manual Workflow Inputs"
            echo "**Target:** \`${{ inputs.target }}\`"
            echo "**Config:** \`${{ inputs.config }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  nominatim-data:
    name: Nominatim Data
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Build nominatim data
        id: build
        uses: ./.github/actions/build-nominatim-data
        with:
          config: ${{ inputs.config }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  photon:
    name: Photon Image
    needs: nominatim-data
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Build Photon image
        id: build
        uses: ./.github/actions/build-photon-image
        with:
          nominatim_data_tag: ${{ needs.nominatim-data.outputs.image_tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy:
    name: Deploy
    needs: photon
    uses: ./.github/workflows/_photon-deploy-fanout.yml
    with:
      image: "geocoder-photon:${{ needs.photon.outputs.image_tag }}"
      target: ${{ inputs.target }}
    secrets: inherit

  notify-slack:
    needs: [ nominatim-data, photon, deploy ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* (${{ inputs.target }}) failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
