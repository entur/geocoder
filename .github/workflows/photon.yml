name: Photon — Import, Build & Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - 'dev only'
          - 'dev → tst → prd'
          - 'tst → prd'
      config:
        description: 'Nominatim config'
        required: false
        type: string
        default: 'converter-prod.json'

concurrency:
  group: "${{ github.workflow }}-${{ inputs.target }}"
  cancel-in-progress: true

jobs:
  log-inputs:
    name: Log Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Log manual inputs
        run: |
          {
            echo "### Manual Workflow Inputs"
            echo "**Target:** \`${{ inputs.target }}\`"
            echo "**Config:** \`${{ inputs.config }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  generate-tag:
    name: Generate Tag
    uses: ./.github/workflows/_generate-tag.yml

  nominatim-data:
    name: Nominatim Data
    needs: generate-tag
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Build nominatim data
        id: build
        uses: ./.github/actions/build-nominatim-data
        with:
          config: ${{ inputs.config }}
          build_tag: ${{ needs.generate-tag.outputs.tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  photon:
    name: Photon Image
    needs: [generate-tag, nominatim-data]
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Build Photon image
        id: build
        uses: ./.github/actions/build-photon-image
        with:
          nominatim_data_tag: ${{ needs.nominatim-data.outputs.image_tag }}
          build_tag: ${{ needs.generate-tag.outputs.tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy-dev:
    name: Dev
    needs: photon
    if: inputs.target == 'dev only' || inputs.target == 'dev → tst → prd'
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: dev
      image: "geocoder-photon:${{ needs.photon.outputs.image_tag }}"
      chart: helm/geocoder-photon
      namespace: geocoder
      release_name: geocoder-photon
      values: values-kub-ent-dev.yaml
      photon_data_prefix: photon-data
      require_approval: false
    secrets: inherit

  deploy-tst:
    name: Staging
    needs: [ photon, deploy-dev ]
    if: |
      !cancelled() &&
      (inputs.target == 'dev → tst → prd' || inputs.target == 'tst → prd') &&
      needs.photon.result == 'success' &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: tst
      image: "geocoder-photon:${{ needs.photon.outputs.image_tag }}"
      chart: helm/geocoder-photon
      namespace: geocoder
      release_name: geocoder-photon
      values: values-kub-ent-tst.yaml
      photon_data_prefix: photon-data
    secrets: inherit

  deploy-prd:
    name: Prod
    needs: [ photon, deploy-tst ]
    if: |
      !cancelled() &&
      needs.deploy-tst.result == 'success'
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: prd
      image: "geocoder-photon:${{ needs.photon.outputs.image_tag }}"
      chart: helm/geocoder-photon
      namespace: geocoder
      release_name: geocoder-photon
      values: values-kub-ent-prd.yaml
      photon_data_prefix: photon-data
    secrets: inherit

  notify-slack:
    needs: [ generate-tag, nominatim-data, photon, deploy-dev, deploy-tst, deploy-prd ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* (${{ inputs.target }}) failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
