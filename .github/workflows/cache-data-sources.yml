name: Cache Data Sources to GCS

on:
  schedule:
    # 03:00 UTC is 04:00 CET or 05:00 CEST
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  cache:
    name: Cache ${{ matrix.source.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        source:
          - name: matrikkel
            url: https://nedlasting.geonorge.no/geonorge/Basisdata/MatrikkelenAdresse/CSV/Basisdata_0000_Norge_25833_MatrikkelenAdresse_CSV.zip
            filename: Basisdata_0000_Norge_25833_MatrikkelenAdresse_CSV.zip
            min_size_mb: 100
          - name: stedsnavn
            url: https://nedlasting.geonorge.no/geonorge/Basisdata/Stedsnavn/GML/Basisdata_0000_Norge_25833_Stedsnavn_GML.zip
            filename: Basisdata_0000_Norge_25833_Stedsnavn_GML.zip
            min_size_mb: 100

    steps:
      - name: Download ${{ matrix.source.name }}
        run: |
          curl -fL --retry 3 --retry-delay 10 -o "${{ matrix.source.filename }}" "${{ matrix.source.url }}"
          ls -lh "${{ matrix.source.filename }}"

      - name: Verify file size
        run: |
          SIZE_MB=$(du -m "${{ matrix.source.filename }}" | cut -f1)
          MIN_MB=${{ matrix.source.min_size_mb }}
          echo "Size: ${SIZE_MB}M (min ${MIN_MB}M)"
          if [ "$SIZE_MB" -lt "$MIN_MB" ]; then
            echo "ERROR: file smaller than minimum"
            exit 1
          fi

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        env:
          CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: "False"
        run: |
          gcloud storage cp "${{ matrix.source.filename }}" \
            "gs://ent-geocoder-prd/data-sources/${{ matrix.source.filename }}"

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.source.name }}"
            echo "**Source:** ${{ matrix.source.url }}"
            echo "**Cached:** \`gs://ent-geocoder-prd/data-sources/${{ matrix.source.filename }}\`"
            echo "**Size:** $(du -h "${{ matrix.source.filename }}" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

  posthog-popular-stops:
    name: Cache popular stops (${{ matrix.mode }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: fra
            filename: popular-stops-fra.csv
          - mode: til
            filename: popular-stops-til.csv

    steps:
      - uses: actions/checkout@v5

      - name: Fetch ${{ matrix.mode }} from PostHog
        env:
          # Token needs insight:read and query:read scopes.
          TOKEN: ${{ secrets.POSTHOG_TOKEN }}
        run: |
          .github/scripts/fetch-posthog-popular-stops.sh "${{ matrix.mode }}" > "${{ matrix.filename }}"
          echo "Wrote $(wc -l < "${{ matrix.filename }}") lines to ${{ matrix.filename }}"
          head -3 "${{ matrix.filename }}"

      - name: Verify non-empty
        env:
          OUT: ${{ matrix.filename }}
        run: |
          ROWS=$(wc -l < "$OUT")
          echo "Rows: $ROWS"
          if [ "$ROWS" -lt 10 ]; then
            echo "ERROR: only $ROWS rows in $OUT"
            exit 1
          fi

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        env:
          CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: "False"
        run: |
          gcloud storage cp "${{ matrix.filename }}" \
            "gs://ent-geocoder-prd/data-sources/${{ matrix.filename }}"

      - name: Summary
        run: |
          {
            echo "### popular stops (${{ matrix.mode }})"
            echo "**Source:** PostHog insight \`${{ matrix.short_id }}\`"
            echo "**Cached:** \`gs://ent-geocoder-prd/data-sources/${{ matrix.filename }}\`"
            echo "**Rows:** $(wc -l < "${{ matrix.filename }}")"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-slack:
    needs: [cache, posthog-popular-stops]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
