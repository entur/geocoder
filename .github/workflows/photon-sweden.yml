name: Import+Photon Sweden

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build mode'
        required: true
        type: choice
        options:
          - 'Download data → Photon image → deploy'
          - 'Use existing data → Photon image → deploy'
          - 'Deploy specified Photon image'
      nominatim_data_tag:
        description: 'Nominatim data tag (only for "Use existing data")'
        required: false
        type: string
        default: 'latest-main'
      photon_image_tag:
        description: 'Photon image tag (only for "Deploy specified")'
        required: false
        type: string

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  log-inputs:
    name: Log Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Log manual inputs
        run: |
          echo "### Manual Workflow Inputs" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build:** \`${{ inputs.build }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Nominatim data tag:** \`${{ inputs.nominatim_data_tag || 'not specified' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Photon image tag:** \`${{ inputs.photon_image_tag || 'not specified' }}\`" >> "$GITHUB_STEP_SUMMARY"

  nominatim-data:
    name: Nominatim Data
    if: inputs.build == 'Download data → Photon image → deploy'
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Build nominatim data
        id: build
        uses: ./.github/actions/build-nominatim-data
        with:
          config: sweden-test.conf
          suffix: -se
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  photon:
    name: Photon Image
    needs: nominatim-data
    if: |
      !cancelled() &&
      (needs.nominatim-data.result == 'success' || inputs.build == 'Use existing data → Photon image → deploy')
    runs-on:
      group: grp-ubuntu-24.04-8core-x64
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Build Photon image
        id: build
        uses: ./.github/actions/build-photon-image
        with:
          nominatim_data_tag: ${{ needs.nominatim-data.outputs.image_tag || inputs.nominatim_data_tag }}
          suffix: -se
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy-dev:
    name: Dev
    needs: photon
    if: |
      !cancelled() &&
      (needs.photon.result == 'success' || inputs.build == 'Deploy specified Photon image')
    uses: ./.github/workflows/deploy-and-test.yml
    with:
      environment: dev
      image: "geocoder-photon-se:${{ needs.photon.outputs.image_tag || inputs.photon_image_tag }}"
      chart: helm/geocoder-photon
      namespace: geocoder
      release_name: geocoder-photon-se
      values: values-kub-ent-dev-se.yaml
      require_approval: false
      run_tests: false
    secrets: inherit

  notify-slack:
    needs: deploy-dev
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
