name: PROD - Proxy

on:
  push:
    branches: [ prod ]
    paths:
      - 'proxy/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/proxy-prod.yml'
      - '.github/actions/**'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'PROD Deployment'
        required: true
        type: choice
        options:
          - 'Build and deploy'
          - 'Deploy specified image'
      image_tag:
        description: 'Image tag (only for "Deploy specified image")'
        required: false
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  log-inputs:
    name: Log Inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Log manual inputs
        run: |
          echo "### Manual Workflow Inputs" >> "$GITHUB_STEP_SUMMARY"
          echo "**Mode:** \`${{ inputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image tag:** \`${{ inputs.image_tag || 'not specified' }}\`" >> "$GITHUB_STEP_SUMMARY"

  resolve-tag:
    name: Resolve Tag
    if: inputs.mode == 'Deploy specified image'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.resolve.outputs.resolved_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: prod

      - name: Resolve image tag
        id: resolve
        uses: ./.github/actions/resolve-image-tag
        with:
          image_name: geocoder-proxy
          image_tag: ${{ inputs.image_tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  lint:
    name: Lint
    if: github.event_name == 'push' || inputs.mode == 'Build and deploy'
    uses: entur/gha-docker/.github/workflows/lint.yml@v1
    with:
      dockerfile: proxy/Dockerfile
      ignore: "DL3018,DL3059"

  build-push:
    name: Proxy
    needs: lint
    if: |
      !cancelled() &&
      (github.event_name == 'push' || inputs.mode == 'Build and deploy') &&
      needs.lint.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.build-push.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: prod

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 25
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew --no-daemon :proxy:build

      - name: Build and Push
        id: build-push
        uses: ./.github/actions/docker-build-push
        with:
          image_name: geocoder-proxy
          context: proxy
          push: true
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  scan:
    name: Scan
    needs: build-push
    if: |
      !cancelled() &&
      inputs.mode == 'Build and deploy' &&
      needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: prod

      - name: Security Scan
        uses: ./.github/actions/docker-scan
        with:
          image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag }}"
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  helm-lint:
    name: Helm Lint
    if: github.event_name == 'workflow_dispatch'
    uses: entur/gha-helm/.github/workflows/lint.yml@v1
    strategy:
      matrix:
        environment: [tst,prd]
    with:
      environment: ${{ matrix.environment }}
      chart: helm/geocoder-proxy

  deploy-tst:
    name: Staging
    needs: [ build-push, scan, helm-lint, resolve-tag ]
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      needs.helm-lint.result == 'success' &&
      (needs.scan.result == 'success' || needs.resolve-tag.result == 'success')
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: tst
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag || needs.resolve-tag.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
    secrets: inherit

  acceptance-tests-tst:
    name: Staging Tests
    if: |
      !cancelled() &&
      needs.deploy-tst.result == 'success'
    needs: deploy-tst
    uses: "./.github/workflows/acceptance-tests.yml"
    with:
      environment: tst

  deploy-prd:
    name: Prod
    if: |
      !cancelled() &&
      needs.acceptance-tests-tst.result == 'success'
    needs: [ build-push, resolve-tag, acceptance-tests-tst ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: prd
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag || needs.resolve-tag.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
    secrets: inherit

  acceptance-tests-prd:
    name: Prod Tests
    if: |
      !cancelled() &&
      needs.deploy-prd.result == 'success'
    needs: deploy-prd
    uses: "./.github/workflows/acceptance-tests.yml"
    with:
      environment: prd

  notify-slack:
    needs: acceptance-tests-prd
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
