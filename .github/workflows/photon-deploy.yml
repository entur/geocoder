name: Photon — Deploy Existing Image

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - 'dev only'
          - 'dev → tst → prd'
          - 'tst → prd'
      image_tag:
        description: 'Photon build tag, <branch>.<timestamp>-SHA<sha>'
        required: true
        type: string
      photon_data_tag:
        description: 'photon_data tag to load (default: same as the image tag)'
        required: false
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ inputs.target }}"
  cancel-in-progress: true

jobs:
  log-inputs:
    name: Log Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Log manual inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DATA_TAG: ${{ inputs.photon_data_tag }}
        run: |
          {
            echo "### Manual Workflow Inputs"
            echo "**Target:** \`${{ inputs.target }}\`"
            echo "**Image tag:** \`$IMAGE_TAG\`"
            echo "**Photon data tag:** \`${DATA_TAG:-same as image}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-tag:
    name: Verify Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify-image-tag
        with:
          image_name: geocoder-photon
          image_tag: ${{ inputs.image_tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy-dev:
    name: Dev
    needs: verify-tag
    if: inputs.target == 'dev only' || inputs.target == 'dev → tst → prd'
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: dev
      image: "geocoder-photon:${{ inputs.image_tag }}"
      photon_data_tag: ${{ inputs.photon_data_tag }}
      chart: helm/geocoder-photon
      release_name: geocoder-photon
      photon_data_prefix: photon-data
      require_approval: false
    secrets: inherit

  deploy-tst:
    name: Staging
    needs: [ verify-tag, deploy-dev ]
    if: |
      !cancelled() &&
      (inputs.target == 'dev → tst → prd' || inputs.target == 'tst → prd') &&
      needs.verify-tag.result == 'success' &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: tst
      image: "geocoder-photon:${{ inputs.image_tag }}"
      photon_data_tag: ${{ inputs.photon_data_tag }}
      chart: helm/geocoder-photon
      release_name: geocoder-photon
      photon_data_prefix: photon-data
    secrets: inherit

  deploy-prd:
    name: Prod
    needs: [ verify-tag, deploy-tst ]
    if: |
      !cancelled() &&
      needs.deploy-tst.result == 'success'
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: prd
      image: "geocoder-photon:${{ inputs.image_tag }}"
      photon_data_tag: ${{ inputs.photon_data_tag }}
      chart: helm/geocoder-photon
      release_name: geocoder-photon
      photon_data_prefix: photon-data
    secrets: inherit

  notify-slack:
    needs: [ verify-tag, deploy-dev, deploy-tst, deploy-prd ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* (${{ inputs.target }}) failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
