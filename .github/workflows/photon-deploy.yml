name: Photon — Deploy Existing Image

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - 'dev only'
          - 'dev → tst → prd'
          - 'tst → prd'
      image_tag:
        description: 'Photon image tag (data URL is derived from this tag)'
        required: true
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ inputs.target }}"
  cancel-in-progress: true

jobs:
  log-inputs:
    name: Log Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Log manual inputs
        run: |
          {
            echo "### Manual Workflow Inputs"
            echo "**Target:** \`${{ inputs.target }}\`"
            echo "**Image tag:** \`${{ inputs.image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.resolve.outputs.resolved_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve image tag
        id: resolve
        uses: ./.github/actions/resolve-image-tag
        with:
          image_name: geocoder-photon
          image_tag: ${{ inputs.image_tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy-dev:
    name: Dev
    needs: resolve-tag
    if: inputs.target == 'dev only' || inputs.target == 'dev → tst → prd'
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: dev
      image: "geocoder-photon:${{ needs.resolve-tag.outputs.image_tag }}"
      chart: helm/geocoder-photon
      namespace: geocoder
      release_name: geocoder-photon
      values: values-kub-ent-dev.yaml
      require_approval: false
    secrets: inherit

  deploy-tst:
    name: Staging
    needs: [ resolve-tag, deploy-dev ]
    if: |
      !cancelled() &&
      (inputs.target == 'dev → tst → prd' || inputs.target == 'tst → prd') &&
      needs.resolve-tag.result == 'success' &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: tst
      image: "geocoder-photon:${{ needs.resolve-tag.outputs.image_tag }}"
      chart: helm/geocoder-photon
      namespace: geocoder
      release_name: geocoder-photon
      values: values-kub-ent-tst.yaml
    secrets: inherit

  deploy-prd:
    name: Prod
    needs: [ resolve-tag, deploy-tst ]
    if: |
      !cancelled() &&
      needs.deploy-tst.result == 'success'
    uses: ./.github/workflows/_deploy-and-test.yml
    with:
      environment: prd
      image: "geocoder-photon:${{ needs.resolve-tag.outputs.image_tag }}"
      chart: helm/geocoder-photon
      namespace: geocoder
      release_name: geocoder-photon
      values: values-kub-ent-prd.yaml
    secrets: inherit

  notify-slack:
    needs: [ resolve-tag, deploy-dev, deploy-tst, deploy-prd ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* (${{ inputs.target }}) failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
