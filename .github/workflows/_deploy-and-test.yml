name: "~ Deploy & Test (internal)"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      chart:
        required: true
        type: string
      namespace:
        required: true
        type: string
      release_name:
        required: true
        type: string
      values:
        required: false
        type: string
        default: ''
      photon_data_prefix:
        description: 'GCS prefix for the photon_data.tar.gz tarball (default photon-data; -se variants for Sweden). Set to empty to skip injection (non-photon deploys).'
        required: false
        type: string
        default: 'photon-data'
      photon_data_bucket:
        description: 'GCS bucket holding photon_data.tar.gz'
        required: false
        type: string
        default: 'ent-geocoder-prd'
      require_approval:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true

jobs:
  approval:
    name: "${{ inputs.environment }} Approve"
    if: inputs.require_approval
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: Approve
    steps:
      - name: Manual approval
        run: echo "Approve ${{ inputs.environment }} deployment"

  deploy:
    name: Deploy
    needs: approval
    if: |
      !cancelled() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      GHA_HELM_DEPLOY_REGISTRY: eu.gcr.io/entur-system-1287
    steps:
      - uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.19.2"

      - name: Inject photon_data_url
        if: inputs.photon_data_prefix != ''
        env:
          CHART: ${{ inputs.chart }}
          VALUES: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
          IMAGE: ${{ inputs.image }}
          BUCKET: ${{ inputs.photon_data_bucket }}
          PREFIX: ${{ inputs.photon_data_prefix }}
        # The photon_data tag matches the image tag (build-photon-image generates
        # one and passes to both docker-build-push and upload-gcs-artifact), so
        # we can derive the data URL from the image tag here. entur/gha-helm
        # takes a single -f, so we mutate the env values file in place.
        run: |
          TAG="${IMAGE##*:}"
          PHOTON_DATA_URL="https://storage.googleapis.com/${BUCKET}/${PREFIX}/${TAG}/photon_data.tar.gz"

          PHOTON_DATA_URL="$PHOTON_DATA_URL" yq -i '
            .common.container.env = (
              (.common.container.env // [])
              | map(select(.name != "PHOTON_DATA_URL"))
              + [{"name": "PHOTON_DATA_URL", "value": strenv(PHOTON_DATA_URL)}]
            )
          ' "$CHART/env/$VALUES"

          echo "### Photon data URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed image will load \`$PHOTON_DATA_URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Helm lint
        env:
          CHART: ${{ inputs.chart }}
          VALUES: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
        run: helm lint --quiet "$CHART" -f "$CHART/env/$VALUES"

      - name: Authenticate with Google Cloud
        uses: entur/gha-meta/.github/actions/cloud-auth@v1
        with:
          environment: ${{ inputs.environment }}
          gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Authenticate with Kubernetes
        uses: entur/gha-meta/.github/actions/k8s-auth@v1
        with:
          environment: ${{ inputs.environment }}

      - name: Helm deploy
        uses: entur/gha-helm/.github/actions/helm-deploy@v1
        with:
          image: ${{ inputs.image }}
          chart: ${{ inputs.chart }}
          values: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
          namespace: ${{ inputs.namespace }}
          release_name: ${{ inputs.release_name }}

      - name: Acceptance tests
        if: inputs.run_tests
        uses: ./.github/actions/acceptance-tests
        with:
          environment: ${{ inputs.environment }}
