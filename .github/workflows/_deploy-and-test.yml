name: "~ Deploy & Test (internal)"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      chart:
        required: true
        type: string
      namespace:
        required: true
        type: string
      release_name:
        required: true
        type: string
      values:
        required: false
        type: string
        default: ''
      photon_data_prefix:
        description: 'GCS prefix for the photon_data.tar.gz tarball (e.g. photon-data, photon-data-se). Leave empty for non-photon deploys.'
        required: false
        type: string
        default: ''
      photon_data_tag:
        description: 'Tag of the photon_data.tar.gz to load. Defaults to the image tag, which a full build shares between the image and the data.'
        required: false
        type: string
        default: ''
      require_approval:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true

jobs:
  approval:
    name: Approve
    if: inputs.require_approval
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: Approve
    steps:
      - name: Manual approval
        run: echo "Approve ${{ inputs.environment }} deployment"

  deploy:
    name: Deploy
    needs: approval
    if: |
      !cancelled() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      GHA_HELM_DEPLOY_REGISTRY: eu.gcr.io/entur-system-1287
    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.19.2"

      - name: Inject photon_data_url
        if: inputs.photon_data_prefix != ''
        env:
          CHART: ${{ inputs.chart }}
          IMAGE: ${{ inputs.image }}
          PREFIX: ${{ inputs.photon_data_prefix }}
          DATA_TAG: ${{ inputs.photon_data_tag }}
        # photon_data_tag overrides the image tag for a data-only refresh.
        run: |
          TAG="${DATA_TAG:-${IMAGE##*:}}"
          [[ $TAG =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad photon data tag '$TAG'"; exit 1; }
          PHOTON_DATA_URL="https://storage.googleapis.com/ent-geocoder-prd/${PREFIX}/${TAG}/photon_data.tar.gz"

          # An image tag can now outlive the data uploaded beside it (90-day bucket
          # lifecycle). Without this the init containers just fail and the rollout
          # stalls until helm times out and rolls back.
          curl -fsI -A entur-geocoder "$PHOTON_DATA_URL" > /dev/null
          curl -fsI -A entur-geocoder "$PHOTON_DATA_URL.sha256" > /dev/null

          sed -i "s|__PHOTON_DATA_URL__|${PHOTON_DATA_URL}|g" "$CHART/values.yaml"

          echo "### Photon data URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed image will load \`$PHOTON_DATA_URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Helm lint
        env:
          CHART: ${{ inputs.chart }}
          VALUES: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
        run: helm lint --quiet "$CHART" -f "$CHART/env/$VALUES"

      - name: Authenticate with Google Cloud
        uses: entur/gha-meta/.github/actions/cloud-auth@v1
        with:
          environment: ${{ inputs.environment }}
          gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Authenticate with Kubernetes
        uses: entur/gha-meta/.github/actions/k8s-auth@v1
        with:
          environment: ${{ inputs.environment }}

      - name: Helm deploy
        uses: entur/gha-helm/.github/actions/helm-deploy@v2
        with:
          image: ${{ inputs.image }}
          chart: ${{ inputs.chart }}
          values: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
          namespace: ${{ inputs.namespace }}
          release_name: ${{ inputs.release_name }}

      - name: Acceptance tests
        if: inputs.run_tests
        uses: ./.github/actions/acceptance-tests
        with:
          environment: ${{ inputs.environment }}
