name: "~ Deploy & Test (internal)"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      chart:
        required: true
        type: string
      namespace:
        required: true
        type: string
      release_name:
        required: true
        type: string
      values:
        required: false
        type: string
        default: ''
      photon_data_prefix:
        description: 'GCS prefix for the photon_data.tar.gz tarball (e.g. photon-data, photon-data-se). Leave empty for non-photon deploys.'
        required: false
        type: string
        default: ''
      require_approval:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true

jobs:
  approval:
    name: Approve
    if: inputs.require_approval
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: Approve
    steps:
      - name: Manual approval
        run: echo "Approve ${{ inputs.environment }} deployment"

  deploy:
    name: Deploy
    needs: approval
    if: |
      !cancelled() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      GHA_HELM_DEPLOY_REGISTRY: eu.gcr.io/entur-system-1287
    steps:
      - uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.19.2"

      - name: Inject photon_data_url
        if: inputs.photon_data_prefix != ''
        env:
          CHART: ${{ inputs.chart }}
          IMAGE: ${{ inputs.image }}
          PREFIX: ${{ inputs.photon_data_prefix }}
        # The photon_data tag matches the image tag (build-photon-image generates
        # one and passes to both docker-build-push and upload-gcs-artifact), so
        # we can derive the data URL from the image tag here. The chart's
        # values.yaml carries a __PHOTON_DATA_URL__ placeholder that we resolve
        # in place; templates/photon-data-validation.yaml fails the render if
        # the placeholder remains.
        run: |
          TAG="${IMAGE##*:}"
          PHOTON_DATA_URL="https://storage.googleapis.com/ent-geocoder-prd/${PREFIX}/${TAG}/photon_data.tar.gz"
          sed -i "s|__PHOTON_DATA_URL__|${PHOTON_DATA_URL}|g" "$CHART/values.yaml"

          echo "### Photon data URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed image will load \`$PHOTON_DATA_URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Helm lint
        env:
          CHART: ${{ inputs.chart }}
          VALUES: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
        run: helm lint --quiet "$CHART" -f "$CHART/env/$VALUES"

      - name: Authenticate with Google Cloud
        uses: entur/gha-meta/.github/actions/cloud-auth@v1
        with:
          environment: ${{ inputs.environment }}
          gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Authenticate with Kubernetes
        uses: entur/gha-meta/.github/actions/k8s-auth@v1
        with:
          environment: ${{ inputs.environment }}

      - name: Helm deploy
        uses: entur/gha-helm/.github/actions/helm-deploy@v2
        with:
          image: ${{ inputs.image }}
          chart: ${{ inputs.chart }}
          values: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
          namespace: ${{ inputs.namespace }}
          release_name: ${{ inputs.release_name }}

      - name: Acceptance tests
        if: inputs.run_tests
        uses: ./.github/actions/acceptance-tests
        with:
          environment: ${{ inputs.environment }}

  record:
    name: Record Prod Build
    needs: deploy
    # Only a prd build that passed its tests may move the pointer the nightly rebuilds
    # from. Separate job so a failed write doesn't read as a failed prd deploy.
    # The three prd entry points have independent concurrency groups, so a run can be
    # superseded while its tests are still running; hence the check against the cluster.
    if: |
      inputs.environment == 'prd' &&
      inputs.photon_data_prefix != '' &&
      inputs.run_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate with Google Cloud
        uses: entur/gha-meta/.github/actions/cloud-auth@v1
        with:
          environment: ${{ inputs.environment }}
          gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Authenticate with Kubernetes
        uses: entur/gha-meta/.github/actions/k8s-auth@v1
        with:
          environment: ${{ inputs.environment }}

      - name: Verify this build should be recorded
        id: verify
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          RELEASE: ${{ inputs.release_name }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          TAG="${IMAGE##*:}"
          SHORT=$(./.github/scripts/resolve-prod-ref.sh "$TAG")   # also rejects alias tags
          LIVE=$(kubectl get deployment "$RELEASE" -n "$NAMESPACE" \
            -o jsonpath='{range .spec.template.spec.containers[*]}{.image}{"\n"}{end}' \
            | grep "${IMAGE%%:*}:")

          if [ "${LIVE##*:}" != "$TAG" ]; then
            echo "::warning::prd runs ${LIVE##*:}, not $TAG; a later run superseded this one"
            echo "record=false" >> "$GITHUB_OUTPUT"
          elif ! git merge-base --is-ancestor "$SHORT" origin/main; then
            echo "::warning::$TAG was not built from main, so the nightly would rebuild unreviewed code; leaving the pointer where it is"
            echo "record=false" >> "$GITHUB_OUTPUT"
          else
            echo "record=true" >> "$GITHUB_OUTPUT"
          fi

      # CI credentials, because the bucket belongs to CI rather than to prd. Last, so
      # they never shadow the prd ones above.
      - name: Authenticate for the pointer write
        if: steps.verify.outputs.record == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Move latest-prod pointers
        if: steps.verify.outputs.record == 'true'
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          PREFIX: ${{ inputs.photon_data_prefix }}
        run: |
          TAG="${IMAGE##*:}"
          [ "$PREFIX" = photon-data ] || { echo "::error::unexpected prefix $PREFIX"; exit 1; }

          # photon-data last: the nightly reads that one, so a failed second write
          # leaves it on the previous known-good build.
          for P in nominatim-data photon-data; do
            echo "$TAG" | gcloud storage cp \
              --content-type=text/plain \
              --cache-control="no-cache, max-age=0" \
              - "gs://ent-geocoder-prd/$P/latest-prod.txt"
          done

          echo "\`latest-prod.txt\` now names \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
