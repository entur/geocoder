name: Proxy — CI

on:
  push:
    branches: [ main ]
    paths:
      - 'proxy/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/proxy.yml'
      - '.github/workflows/deploy-and-test.yml'
      - '.github/actions/**'
      - '!**/*.md'
      - 'helm/geocoder-proxy/**'
  pull_request:
    paths:
      - 'proxy/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/proxy.yml'
      - '.github/workflows/deploy-and-test.yml'
      - '.github/actions/**'
      - '!**/*.md'
      - 'helm/geocoder-proxy/**'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-push:
    name: Proxy
    runs-on: ubuntu-latest
    timeout-minutes: 600
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Build Proxy image
        id: build
        uses: ./.github/actions/build-proxy-image
        with:
          push: ${{ github.event_name != 'pull_request' }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  deploy-dev:
    name: Dev
    needs: build-push
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-and-test.yml
    with:
      environment: dev
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
      values: values-kub-ent-dev.yaml
      require_approval: false
    secrets: inherit

  deploy-tst:
    name: Staging
    needs: [ build-push, deploy-dev ]
    if: |
      !cancelled() &&
      needs.deploy-dev.result == 'success'
    uses: ./.github/workflows/deploy-and-test.yml
    with:
      environment: tst
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
    secrets: inherit

  deploy-prd:
    name: Production
    needs: [ build-push, deploy-tst ]
    if: |
      !cancelled() &&
      needs.deploy-tst.result == 'success'
    uses: ./.github/workflows/deploy-and-test.yml
    with:
      environment: prd
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
    secrets: inherit

  publish-api-docs:
    name: Publish API Docs
    needs: deploy-prd
    if: |
      !cancelled() &&
      needs.deploy-prd.result == 'success'
    uses: "./.github/workflows/api-docs.yml"
    secrets: inherit

  notify-slack:
    needs: [ deploy-dev, deploy-tst, deploy-prd ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
