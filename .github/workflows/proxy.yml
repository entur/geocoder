name: Proxy

on:
  push:
    branches: [ main ]
    paths:
      - 'proxy/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/proxy.yml'
      - '.github/actions/**'
      - '!**/*.md'
      - 'helm/geocoder-proxy/**'
  pull_request:
    paths:
      - 'proxy/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/proxy.yml'
      - '.github/actions/**'
      - '!**/*.md'
      - 'helm/geocoder-proxy/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - 'dev'
          - 'tst → prd'
      variant:
        description: 'Variant suffix (only for dev; empty for Norway, -se for Sweden)'
        required: false
        type: choice
        options:
          - ''
          - '-se'
      mode:
        description: 'Build mode (only for tst → prd)'
        required: false
        type: choice
        options:
          - 'Build and deploy'
          - 'Deploy specified image'
      image_tag:
        description: 'Image tag (for dev dispatch or "Deploy specified image")'
        required: false
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ inputs.variant }}"
  cancel-in-progress: true

jobs:
  log-inputs:
    name: Log Inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Log manual inputs
        run: |
          echo "### Manual Workflow Inputs" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** \`${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Variant:** \`${{ inputs.variant || '(default)' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Mode:** \`${{ inputs.mode || '(default)' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image tag:** \`${{ inputs.image_tag || 'not specified' }}\`" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    if: |
      github.event_name != 'workflow_dispatch' ||
      (inputs.target == 'tst → prd' && inputs.mode != 'Deploy specified image')
    uses: entur/gha-docker/.github/workflows/lint.yml@v1
    with:
      dockerfile: proxy/Dockerfile
      ignore: "DL3018,DL3059"

  build-push:
    name: Proxy
    needs: lint
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.target == 'tst → prd' && inputs.mode != 'Deploy specified image'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.build-push.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 25
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew --no-daemon :proxy:build

      - name: Build and Push
        id: build-push
        uses: ./.github/actions/docker-build-push
        with:
          image_name: geocoder-proxy
          context: proxy
          push: ${{ github.event_name != 'pull_request' }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  scan:
    name: Scan
    needs: build-push
    if: |
      !cancelled() &&
      needs.build-push.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Security Scan
        uses: ./.github/actions/docker-scan
        with:
          image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag }}"
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  resolve-tag:
    name: Resolve Tag
    if: inputs.mode == 'Deploy specified image'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.resolve.outputs.resolved_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: resolve
        uses: ./.github/actions/resolve-image-tag
        with:
          image_name: geocoder-proxy
          image_tag: ${{ inputs.image_tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  # --- Dev path ---

  helm-lint-dev:
    name: Helm Lint (dev)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'dev'
    uses: entur/gha-helm/.github/workflows/lint.yml@v1
    with:
      environment: dev
      chart: helm/geocoder-proxy
      values: values-kub-ent-dev${{ inputs.variant }}.yaml

  deploy-dev:
    name: Dev
    needs: [ build-push, scan, helm-lint-dev ]
    if: |
      !cancelled() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')) &&
      needs.helm-lint-dev.result == 'success' &&
      (needs.scan.result == 'success' || github.event_name == 'workflow_dispatch')
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: dev
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag || inputs.image_tag || 'latest-main' }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy${{ inputs.variant }}
      values: values-kub-ent-dev${{ inputs.variant }}.yaml
    secrets: inherit

  acceptance-tests-dev:
    name: Dev Tests
    if: |
      !cancelled() &&
      needs.deploy-dev.result == 'success' &&
      inputs.variant == ''
    needs: deploy-dev
    uses: "./.github/workflows/acceptance-tests.yml"
    with:
      environment: dev

  # --- TST → PRD path ---

  helm-lint-tst-prd:
    name: Helm Lint
    if: github.event_name == 'push' || inputs.target == 'tst → prd'
    uses: entur/gha-helm/.github/workflows/lint.yml@v1
    strategy:
      matrix:
        environment: [tst, prd]
    with:
      environment: ${{ matrix.environment }}
      chart: helm/geocoder-proxy

  approval-tst:
    name: Approve TST
    needs: [ build-push, scan, helm-lint-tst-prd, resolve-tag, acceptance-tests-dev ]
    if: |
      !cancelled() &&
      (github.event_name == 'push' || inputs.target == 'tst → prd') &&
      needs.helm-lint-tst-prd.result == 'success' &&
      (needs.scan.result == 'success' || needs.resolve-tag.result == 'success') &&
      (github.event_name != 'push' || needs.acceptance-tests-dev.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"

  deploy-tst:
    name: Staging
    needs: [ build-push, resolve-tag, approval-tst ]
    if: |
      !cancelled() &&
      needs.approval-tst.result == 'success'
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: tst
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag || needs.resolve-tag.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
    secrets: inherit

  acceptance-tests-tst:
    name: Staging Tests
    if: |
      !cancelled() &&
      needs.deploy-tst.result == 'success'
    needs: deploy-tst
    uses: "./.github/workflows/acceptance-tests.yml"
    with:
      environment: tst

  approval-prd:
    name: Approve PRD
    needs: acceptance-tests-tst
    if: |
      !cancelled() &&
      needs.acceptance-tests-tst.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"

  deploy-prd:
    name: Prod
    needs: [ build-push, resolve-tag, approval-prd ]
    if: |
      !cancelled() &&
      needs.approval-prd.result == 'success'
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: prd
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag || needs.resolve-tag.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
    secrets: inherit

  acceptance-tests-prd:
    name: Prod Tests
    if: |
      !cancelled() &&
      needs.deploy-prd.result == 'success'
    needs: deploy-prd
    uses: "./.github/workflows/acceptance-tests.yml"
    with:
      environment: prd

  publish-api-docs:
    name: Publish API Docs
    needs: acceptance-tests-prd
    if: |
      !cancelled() &&
      needs.acceptance-tests-prd.result == 'success'
    uses: "./.github/workflows/api-docs.yml"
    secrets: inherit

  notify-slack:
    needs: [ deploy-dev, acceptance-tests-dev, deploy-tst, acceptance-tests-tst, deploy-prd, acceptance-tests-prd ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* (${{ inputs.target || 'push' }}${{ inputs.variant && format(' {0}', inputs.variant) || '' }}) failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
