name: Proxy

on:
  push:
    branches: [ main ]
    paths:
      - 'proxy/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/proxy.yml'
      - '.github/actions/**'
      - '!**/*.md'
      - 'helm/geocoder-proxy/**'
  pull_request:
    paths:
      - 'proxy/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/proxy.yml'
      - '.github/actions/**'
      - '!**/*.md'
      - 'helm/geocoder-proxy/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - 'dev'
          - 'tst → prd'
      variant:
        description: 'Variant suffix (only for dev; empty for Norway, -se for Sweden)'
        required: false
        type: choice
        options:
          - ''
          - '-se'
      mode:
        description: 'Build mode (only for tst → prd)'
        required: false
        type: choice
        options:
          - 'Build and deploy'
          - 'Deploy specified image'
      image_tag:
        description: 'Image tag (for dev dispatch or "Deploy specified image")'
        required: false
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ inputs.variant }}"
  cancel-in-progress: true

jobs:
  log-inputs:
    name: Log Inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Log manual inputs
        run: |
          echo "### Manual Workflow Inputs" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** \`${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Variant:** \`${{ inputs.variant || '(default)' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Mode:** \`${{ inputs.mode || '(default)' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image tag:** \`${{ inputs.image_tag || 'not specified' }}\`" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    if: |
      github.event_name != 'workflow_dispatch' ||
      (inputs.target == 'tst → prd' && inputs.mode != 'Deploy specified image')
    uses: entur/gha-docker/.github/workflows/lint.yml@v1
    with:
      dockerfile: proxy/Dockerfile
      ignore: "DL3018,DL3059"

  build-push:
    name: Proxy
    needs: lint
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.target == 'tst → prd' && inputs.mode != 'Deploy specified image'))
    runs-on: ubuntu-latest
    timeout-minutes: 600
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    outputs:
      image_tag: ${{ steps.build-push.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 25
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew --no-daemon :proxy:build

      - name: Build and Push
        id: build-push
        uses: ./.github/actions/docker-build-push
        with:
          image_name: geocoder-proxy
          context: proxy
          push: ${{ github.event_name != 'pull_request' }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Security Scan
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/docker-scan
        with:
          image: "geocoder-proxy:${{ steps.build-push.outputs.image_tag }}"
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  resolve-tag:
    name: Resolve Tag
    if: inputs.mode == 'Deploy specified image'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.resolve.outputs.resolved_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: resolve
        uses: ./.github/actions/resolve-image-tag
        with:
          image_name: geocoder-proxy
          image_tag: ${{ inputs.image_tag }}
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  # --- Dev ---

  deploy-dev:
    name: Dev
    needs: build-push
    if: |
      !cancelled() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')) &&
      (needs.build-push.result == 'success' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-and-test.yml
    with:
      environment: dev
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag || inputs.image_tag || 'latest-main' }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy${{ inputs.variant }}
      values: values-kub-ent-dev${{ inputs.variant }}.yaml
      require_approval: false
      run_tests: ${{ inputs.variant == '' }}
    secrets: inherit

  # --- TST → PRD ---

  deploy-tst:
    name: Staging
    needs: [ build-push, resolve-tag, deploy-dev ]
    if: |
      !cancelled() &&
      (github.event_name == 'push' || inputs.target == 'tst → prd') &&
      (needs.build-push.result == 'success' || needs.resolve-tag.result == 'success') &&
      (github.event_name != 'push' || needs.deploy-dev.result == 'success')
    uses: ./.github/workflows/deploy-and-test.yml
    with:
      environment: tst
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag || needs.resolve-tag.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
    secrets: inherit

  deploy-prd:
    name: Production
    needs: [ build-push, resolve-tag, deploy-tst ]
    if: |
      !cancelled() &&
      needs.deploy-tst.result == 'success'
    uses: ./.github/workflows/deploy-and-test.yml
    with:
      environment: prd
      image: "geocoder-proxy:${{ needs.build-push.outputs.image_tag || needs.resolve-tag.outputs.image_tag }}"
      chart: helm/geocoder-proxy
      namespace: geocoder
      release_name: geocoder-proxy
    secrets: inherit

  publish-api-docs:
    name: Publish API Docs
    needs: deploy-prd
    if: |
      !cancelled() &&
      needs.deploy-prd.result == 'success'
    uses: "./.github/workflows/api-docs.yml"
    secrets: inherit

  notify-slack:
    needs: [ deploy-dev, deploy-tst, deploy-prd ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_HENRIK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *${{ github.workflow }}* (${{ inputs.target || 'push' }}${{ inputs.variant && format(' {0}', inputs.variant) || '' }}) failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>"
