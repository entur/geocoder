name: Proxy — CI

on:
  push:
    branches: [ main ]
    paths:
      - 'proxy/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/proxy.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'proxy/**'
      - 'gradle/**'
      - '*gradle*'
      - '.github/workflows/proxy.yml'
      - '!**/*.md'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Proxy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image_artifact: geocoder-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: proxy/Dockerfile
          ignore: "DL3018,DL3059"

      - uses: entur/ror-gha-workflows/.github/actions/gradle-cache@cd8dd047eb3a5d9497f46454a5c60315a62c6a66 # v1.2.2
        with:
          java-version: '25'

      - name: Build with Gradle
        run: ./gradlew --no-daemon :proxy:build

      # PRs only: on main, entur/geocoder-deployment-config builds, scans and pushes the
      # image it deploys. The artifact layout is what gha-security's docker-scan expects.
      - if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: proxy
          tags: geocoder-proxy
          outputs: type=docker,dest=/tmp/geocoder-proxy.tar
          push: false
          provenance: false
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geocoder-proxy
          path: /tmp/geocoder-proxy.tar
          retention-days: 1

  scan:
    if: github.event_name == 'pull_request'
    needs: build
    uses: entur/gha-security/.github/workflows/docker-scan.yml@89ffce329b85b10d285defb50bb58c35227d4305 # v2.17.0
    with:
      image_artifact: ${{ needs.build.outputs.image_artifact }}

  # Build, push and deploy happen in the private entur/geocoder-deployment-config.
  trigger-deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'entur' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: deploy-trigger
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        # REST dispatch with an explicit ref: the token only has Actions access,
        # which `gh workflow run`'s default-branch lookup can't use. A missing
        # run link must not fail the job once the dispatch went through.
        run: |
          out=$(gh api -X POST repos/entur/geocoder-deployment-config/actions/workflows/proxy.yml/dispatches \
            -f ref=main -f "inputs[ref]=$GITHUB_SHA" -f "inputs[target]=dev → tst → prd" -F return_run_details=true)
          url=$(jq -r '.html_url // empty' <<<"$out" 2>/dev/null || true)
          echo "Deploy run: ${url:-https://github.com/entur/geocoder-deployment-config/actions/workflows/proxy.yml}" | tee -a "$GITHUB_STEP_SUMMARY"
