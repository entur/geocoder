#
# API Documentation Workflow
#
# The v3 spec ends up at https://developer.entur.no/apis/geocoder
#
# Lint runs on push/PR. On push to main, entur/geocoder-deployment-config publishes.
#

name: API Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'proxy/docs/**'
      - 'proxy/src/main/resources/openapi3.yml'
      - 'proxy/.spectral.yml'
      - '.github/workflows/api-docs.yml'
  pull_request:
    paths:
      - 'proxy/docs/**'
      - 'proxy/src/main/resources/openapi3.yml'
      - 'proxy/.spectral.yml'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-lint:
    strategy:
      matrix:
        spec:
          - proxy/src/main/resources/openapi2.yml
          - proxy/src/main/resources/openapi3.yml
    uses: entur/gha-api/.github/workflows/lint.yml@bcd4972699e455cebffe1328cfb47789a75ca588 # v6.11.0
    with:
      path: ${{ matrix.spec }}
      # The analytics upload needs GCP credentials this public repo doesn't have.
      upload_to_bucket: false

  trigger-publish:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository_owner == 'entur' }}
    needs: api-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: deploy-trigger
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        run: |
          out=$(gh api -X POST repos/entur/geocoder-deployment-config/actions/workflows/api-docs.yml/dispatches \
            -f ref=main -f "inputs[ref]=$GITHUB_SHA" -F return_run_details=true)
          url=$(jq -r '.html_url // empty' <<<"$out" 2>/dev/null || true)
          echo "Publish run: ${url:-https://github.com/entur/geocoder-deployment-config/actions/workflows/api-docs.yml}" | tee -a "$GITHUB_STEP_SUMMARY"
