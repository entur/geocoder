#
# API Documentation Workflow
#
# Api specs end up at https://developer.entur.no/apis/public
#
# Lint runs on push/PR. Publish on push to main or manual dispatch.
#

name: API Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'proxy/docs/**'
      - 'proxy/src/main/resources/openapi3.yml'
      - 'proxy/.spectral.yml'
      - '.github/workflows/api-docs.yml'
  pull_request:
    paths:
      - 'proxy/docs/**'
      - 'proxy/src/main/resources/openapi3.yml'
      - 'proxy/.spectral.yml'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-lint:
    strategy:
      matrix:
        spec:
          - proxy/src/main/resources/openapi.yml
          - proxy/src/main/resources/openapi3.yml
    uses: entur/gha-api/.github/workflows/lint.yml@v6
    secrets: inherit
    with:
      path: ${{ matrix.spec }}

  api-publish-v3:
    if: github.event_name != 'pull_request'
    needs: api-lint
    uses: entur/gha-api/.github/workflows/publish.yml@v6
    secrets: inherit
    with:
      path: proxy/src/main/resources/openapi3.yml

  docs-publish:
    if: github.event_name != 'pull_request'
    needs: api-lint
    uses: entur/gha-docs/.github/workflows/publish.yml@v1
    secrets: inherit
    with:
      project: geocoder
      directory: proxy/docs
