name: Deploy and Test

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      chart:
        required: true
        type: string
      namespace:
        required: true
        type: string
      release_name:
        required: true
        type: string
      values:
        required: false
        type: string
        default: ''
      require_approval:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true

jobs:
  approval:
    name: Approve
    if: inputs.require_approval
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: Approve
    steps:
      - name: Manual approval
        run: echo "Approve ${{ inputs.environment }} deployment"

  deploy:
    name: Deploy
    needs: approval
    if: |
      !cancelled() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      GHA_HELM_DEPLOY_REGISTRY: eu.gcr.io/entur-system-1287
    steps:
      - uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.19.2"

      - name: Helm lint
        env:
          CHART: ${{ inputs.chart }}
          VALUES: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
        run: helm lint --quiet "$CHART" -f "$CHART/env/$VALUES"

      - name: Authenticate with Google Cloud
        uses: entur/gha-meta/.github/actions/cloud-auth@v1
        with:
          environment: ${{ inputs.environment }}
          gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Authenticate with Kubernetes
        uses: entur/gha-meta/.github/actions/k8s-auth@v1
        with:
          environment: ${{ inputs.environment }}

      - name: Helm deploy
        uses: entur/gha-helm/.github/actions/helm-deploy@v1
        with:
          image: ${{ inputs.image }}
          chart: ${{ inputs.chart }}
          values: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
          namespace: ${{ inputs.namespace }}
          release_name: ${{ inputs.release_name }}

      # --- Acceptance Tests ---

      - name: Checkout acceptance tests
        if: inputs.run_tests
        uses: actions/checkout@v6
        with:
          repository: entur/geocoder-acceptance-tests
          path: acceptance-tests

      - name: Setup Node.js
        if: inputs.run_tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: acceptance-tests/package-lock.json

      - name: Install test dependencies
        if: inputs.run_tests
        working-directory: acceptance-tests
        run: npm install

      - name: Run acceptance tests
        if: inputs.run_tests
        id: tests
        working-directory: acceptance-tests
        run: |
          set +e
          set -o pipefail
          npm run v2${{ inputs.environment }} 2>&1 | tee test-output.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test results
        if: always() && inputs.run_tests
        uses: actions/upload-artifact@v5
        with:
          name: test-results-v2${{ inputs.environment }}
          path: acceptance-tests/test-output.log
          retention-days: 30

      - name: Add test summary
        if: always() && inputs.run_tests
        working-directory: acceptance-tests
        run: |
          {
            echo "### Acceptance Test Results - v2${{ inputs.environment }}"
            echo ""
            echo "\`\`\`"
            grep -v 'Tests completed:' test-output.log
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if tests failed
        if: always() && inputs.run_tests && steps.tests.outputs.exit_code != '0'
        run: |
          echo "Tests failed with exit code ${{ steps.tests.outputs.exit_code }}"
          exit 1
