name: "zz Deploy & Test (internal)"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      chart:
        required: true
        type: string
      namespace:
        required: true
        type: string
      release_name:
        required: true
        type: string
      values:
        required: false
        type: string
        default: ''
      require_approval:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true

jobs:
  approval:
    name: Approve
    if: inputs.require_approval
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: Approve
    steps:
      - name: Manual approval
        run: echo "Approve ${{ inputs.environment }} deployment"

  deploy:
    name: Deploy
    needs: approval
    if: |
      !cancelled() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      GHA_HELM_DEPLOY_REGISTRY: eu.gcr.io/entur-system-1287
    steps:
      - uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.19.2"

      - name: Helm lint
        env:
          CHART: ${{ inputs.chart }}
          VALUES: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
        run: helm lint --quiet "$CHART" -f "$CHART/env/$VALUES"

      - name: Authenticate with Google Cloud
        uses: entur/gha-meta/.github/actions/cloud-auth@v1
        with:
          environment: ${{ inputs.environment }}
          gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Authenticate with Kubernetes
        uses: entur/gha-meta/.github/actions/k8s-auth@v1
        with:
          environment: ${{ inputs.environment }}

      - name: Helm deploy
        uses: entur/gha-helm/.github/actions/helm-deploy@v1
        with:
          image: ${{ inputs.image }}
          chart: ${{ inputs.chart }}
          values: ${{ inputs.values || format('values-kub-ent-{0}.yaml', inputs.environment) }}
          namespace: ${{ inputs.namespace }}
          release_name: ${{ inputs.release_name }}

      - name: Acceptance tests
        if: inputs.run_tests
        uses: ./.github/actions/acceptance-tests
        with:
          environment: ${{ inputs.environment }}
