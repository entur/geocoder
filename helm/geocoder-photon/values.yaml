common:
  app: geocoder-photon
  shortname: geocoder # Defined in https://github.com/entur/ror-tf-gcp-common-infrastructure/blob/main/.entur/geocoder/app-geocoder.yml shared with geocoder-proxy
  team: team-ror
  ingress:
    enabled: false
    trafficType: public
  service:
    internalPort: 2322  # What TCP port the application listens on the pod, must match the port in the Dockerfile
  deployment:
    prometheus:
      enabled: true
      path: /metrics
      port: 2322
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0%  # Ensure at least one pod is always available
        maxSurge: 25%  # Allow 25% extra pods during rollout (default)
    minReadySeconds: 10  # Wait 10 seconds after pod is ready before marking it available
  container:
    image: <+artifacts.primary.image>  # CD tool replaces with the actual image
    imagePullPolicy: Always
    cpu: 2
    memory: 2560 # This is request mem. Limit is 20% higher.
    # Sized for the extracted photon_data (a few GB) plus headroom for the
    # in-flight tarball during download/extract.
    ephemeralStorage: 4Gi
    ephemeralStorageLimit: 8Gi
    # PHOTON_DATA_URL is injected by .github/workflows/_deploy-and-test.yml
    # before helm runs. templates/photon-data-validation.yaml fails the
    # helm render if it's missing - a manual `helm upgrade` without
    # injection never reaches the cluster.
    probes:
      enabled: true
      spec:
        # Budget covers: photon_data download (~hundreds of MB) + tar extract +
        # JVM startup + index mmap warmup. 5s * 180 = 15 min ceiling.
        startupProbe:
          tcpSocket:
            port: 2322
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /api?q=test&limit=1
            port: 2322
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /status
            port: 2322
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
  postgres: # sets up a postgres proxy so you can connect to your postgresql instance via localhost on the pod
    enabled: false
