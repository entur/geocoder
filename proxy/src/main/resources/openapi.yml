openapi: 3.0.3
info:
  title: Geocoder v1/v2 (deprecated)
  version: 2.0.0
  description: |
    Geocoding and reverse geocoding for Norwegian addresses and points of interest.

    A new v3 API is available. See the
    [v1/v2 to v3 migration guide](https://developer.entur.no/docs/open-services/geocoder/migration-v2-v3)
    for how the parameters and response format map.
  contact:
    name: Team Ruter og reiseplanlegging
    url: https://developer.entur.org
  license:
    name: EUPL-1.2
    url: https://opensource.org/licenses/EUPL-1.2
  x-entur-metadata:
    id: geocoder-v2
    owner: team-ror
    audience: open

externalDocs:
  description: Geocoder v1/v2 to v3 migration guide
  url: https://developer.entur.no/docs/open-services/geocoder/migration-v2-v3

servers:
  - url: https://api.entur.io/geocoder

tags:
  - name: Autocomplete
  - name: Reverse
  - name: Place

security:
  - {}

paths:
  /v1/autocomplete:
    get:
      tags:
        - Autocomplete
      summary: Autocomplete search
      description: Search for places by text query
      operationId: autocompleteV2
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/Text'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/BoundaryCountry'
        - $ref: '#/components/parameters/BoundaryCountyIds'
        - $ref: '#/components/parameters/BoundaryLocalityIds'
        - $ref: '#/components/parameters/TariffZoneIds'
        - $ref: '#/components/parameters/TariffZoneAuthorities'
        - $ref: '#/components/parameters/FareZoneAuthorities'
        - $ref: '#/components/parameters/Sources'
        - $ref: '#/components/parameters/Layers'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/FocusPointLat'
        - $ref: '#/components/parameters/FocusPointLon'
        - $ref: '#/components/parameters/FocusScale'
        - $ref: '#/components/parameters/FocusWeight'
        - $ref: '#/components/parameters/MultiModal'
      responses:
        '200':
          description: Matching places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                geocoding:
                  version: "0.2"
                  engine:
                    name: "Photon"
                    version: "1.2.0"
                  timestamp: 1781174186971
                type: FeatureCollection
                features:
                  - type: Feature
                    geometry:
                      type: Point
                      coordinates: [10.7522, 59.9110]
                    properties:
                      id: "NSR:StopPlace:59872"
                      gid: "openstreetmap:venue:NSR:StopPlace:59872"
                      layer: "venue"
                      source: "openstreetmap"
                      source_id: "NSR:StopPlace:59872"
                      name: "Oslo S"
                      accuracy: "point"
                      country_a: "NOR"
                      county: "Oslo"
                      county_gid: "whosonfirst:county:KVE:TopographicPlace:03"
                      locality: "Oslo"
                      locality_gid: "whosonfirst:locality:KVE:TopographicPlace:0301"
                      label: "Oslo S, Oslo"
                      category: ["onstreetBus", "railStation"]
                      tariff_zones: ["RUT:TariffZone:1", "RUT:FareZone:4"]
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                geocoding:
                  version: "0.2"
                  attribution: "http://pelias.mapzen.com/v1/attribution"
                  errors: ["Invalid parameters. text cannot be blank"]
                  engine:
                    name: "Photon"
                    version: "1.2.0"
                  timestamp: 1781174186971
                type: FeatureCollection
                features: []

  /v1/reverse:
    get:
      tags:
        - Reverse
      summary: Reverse geocode
      description: Convert coordinates to places
      operationId: reverseV2
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/PointLat'
        - $ref: '#/components/parameters/PointLon'
        - $ref: '#/components/parameters/BoundaryCircleRadius'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/BoundaryCountry'
        - $ref: '#/components/parameters/BoundaryCountyIds'
        - $ref: '#/components/parameters/BoundaryLocalityIds'
        - $ref: '#/components/parameters/TariffZoneIds'
        - $ref: '#/components/parameters/TariffZoneAuthorities'
        - $ref: '#/components/parameters/FareZoneAuthorities'
        - $ref: '#/components/parameters/Sources'
        - $ref: '#/components/parameters/Layers'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/MultiModal'
      responses:
        '200':
          description: Nearby places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                geocoding:
                  version: "0.2"
                  engine:
                    name: "Photon"
                    version: "1.2.0"
                  timestamp: 1781174186971
                type: FeatureCollection
                features:
                  - type: Feature
                    geometry:
                      type: Point
                      coordinates: [10.7522, 59.9110]
                    properties:
                      id: "NSR:StopPlace:59872"
                      gid: "openstreetmap:venue:NSR:StopPlace:59872"
                      layer: "venue"
                      source: "openstreetmap"
                      source_id: "NSR:StopPlace:59872"
                      name: "Oslo S"
                      accuracy: "point"
                      country_a: "NOR"
                      county: "Oslo"
                      county_gid: "whosonfirst:county:KVE:TopographicPlace:03"
                      locality: "Oslo"
                      locality_gid: "whosonfirst:locality:KVE:TopographicPlace:0301"
                      label: "Oslo S, Oslo"
                      category: ["onstreetBus", "railStation"]
                      tariff_zones: ["RUT:TariffZone:1", "RUT:FareZone:4"]
                      distance: 0.142
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                geocoding:
                  version: "0.2"
                  attribution: "http://pelias.mapzen.com/v1/attribution"
                  errors: ["Invalid parameters. Parameter 'point.lat' is required"]
                  engine:
                    name: "Photon"
                    version: "1.2.0"
                  timestamp: 1781174186971
                type: FeatureCollection
                features: []

  /v1/place:
    get:
      tags:
        - Place
      summary: Place lookup
      description: Look up one or more places by ID
      operationId: placeV2
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: Matching places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                geocoding:
                  version: "0.2"
                  engine:
                    name: "Photon"
                    version: "1.2.0"
                  timestamp: 1781174186971
                type: FeatureCollection
                features:
                  - type: Feature
                    geometry:
                      type: Point
                      coordinates: [10.7522, 59.9110]
                    properties:
                      id: "NSR:StopPlace:59872"
                      gid: "openstreetmap:venue:NSR:StopPlace:59872"
                      layer: "venue"
                      source: "openstreetmap"
                      source_id: "NSR:StopPlace:59872"
                      name: "Oslo S"
                      accuracy: "point"
                      country_a: "NOR"
                      county: "Oslo"
                      county_gid: "whosonfirst:county:KVE:TopographicPlace:03"
                      locality: "Oslo"
                      locality_gid: "whosonfirst:locality:KVE:TopographicPlace:0301"
                      label: "Oslo S, Oslo"
                      category: ["onstreetBus", "railStation"]
                      tariff_zones: ["RUT:TariffZone:1", "RUT:FareZone:4"]
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                geocoding:
                  version: "0.2"
                  attribution: "http://pelias.mapzen.com/v1/attribution"
                  errors: ["Invalid parameters. Parameter 'ids' is required"]
                  engine:
                    name: "Photon"
                    version: "1.2.0"
                  timestamp: 1781174186971
                type: FeatureCollection
                features: []

components:
  parameters:
    Ids:
      name: ids
      in: query
      required: true
      description: Place IDs (comma-separated)
      schema:
        type: string
      example: "NSR:StopPlace:59872"

    Text:
      name: text
      in: query
      required: true
      description: Search query
      schema:
        type: string
        minLength: 1
      example: "Oslo S"

    Size:
      name: size
      in: query
      description: Maximum results
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10

    Lang:
      name: lang
      in: query
      description: Language code
      schema:
        type: string
        default: "no"
      example: "no"

    BoundaryCountry:
      name: boundary.country
      in: query
      description: Country code filter (comma-separated)
      schema:
        type: string
      example: "NO"

    BoundaryCountyIds:
      name: boundary.county_ids
      in: query
      description: County IDs filter (comma-separated)
      schema:
        type: string
      example: "KVE:TopographicPlace:03"

    BoundaryLocalityIds:
      name: boundary.locality_ids
      in: query
      description: Locality IDs filter (comma-separated)
      schema:
        type: string
      example: "KVE:TopographicPlace:0301"

    TariffZoneIds:
      name: tariff_zone_ids
      in: query
      description: Tariff zone IDs filter (comma-separated)
      schema:
        type: string
      example: "RUT:TariffZone:1"

    TariffZoneAuthorities:
      name: tariff_zone_authorities
      in: query
      description: Tariff zone authorities filter (comma-separated)
      schema:
        type: string
      example: "RUT"

    FareZoneAuthorities:
      name: fare_zone_authorities
      in: query
      description: Fare zone authorities filter (comma-separated)
      schema:
        type: string
      example: "RUT:Authority:RUT"

    Sources:
      name: sources
      in: query
      description: Data sources filter (comma-separated)
      schema:
        type: string
        enum: [openstreetmap,openaddresses,whosonfirst]
      example: "openstreetmap"


    Layers:
      name: layers
      in: query
      description: Layer types filter (comma-separated)
      schema:
        type: string
        enum: [venue,address]
      example: "venue"

    Categories:
      name: categories
      in: query
      description: Categories filter (comma-separated)
      schema:
        type: string
      example: "onstreetBus"

    FocusPointLat:
      name: focus.point.lat
      in: query
      description: Focus latitude
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 59.9139

    FocusPointLon:
      name: focus.point.lon
      in: query
      description: Focus longitude
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: 10.7522

    FocusScale:
      name: focus.scale
      in: query
      description: Focus scale (km)
      schema:
        type: integer
        minimum: 1
      example: 50

    FocusWeight:
      name: focus.weight
      in: query
      description: Focus weight
      schema:
        type: number
        format: double
        minimum: 0
      example: 15.0

    MultiModal:
      name: multiModal
      in: query
      description: Multi-modal mode
      schema:
        type: string
        enum: [parent, child, all]
        default: parent
      example: "all"

    PointLat:
      name: point.lat
      in: query
      required: true
      description: Latitude
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 59.9110

    PointLon:
      name: point.lon
      in: query
      required: true
      description: Longitude
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: 10.7522

    BoundaryCircleRadius:
      name: boundary.circle.radius
      in: query
      description: Search radius (km)
      schema:
        type: number
        format: double
        minimum: 0
      example: 2.5

  schemas:
    Result:
      type: object
      required:
        - geocoding
        - type
        - features
      properties:
        geocoding:
          type: object
          required:
            - version
            - timestamp
          properties:
            version:
              type: string
              example: "0.2"
            attribution:
              type: string
              example: "http://pelias.mapzen.com/v1/attribution"
            errors:
              type: array
              description: Error messages. Only present on error responses.
              items:
                type: string
              example: ["Invalid parameters. Parameter 'point.lat' is required"]
            timestamp:
              type: integer
              format: int64
              description: Response generation time in milliseconds since the epoch.
              example: 1732104123000
            engine:
              type: object
              properties:
                name:
                  type: string
                  example: "Photon"
                version:
                  type: string
                  example: "1.2.0"
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4

    Feature:
      type: object
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          type: string
          enum: [Feature]
        geometry:
          type: object
          required:
            - type
            - coordinates
          properties:
            type:
              type: string
              enum: [Point]
            coordinates:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
              example: [10.7522, 59.9110]
        properties:
          type: object
          properties:
            id:
              type: string
              example: "NSR:StopPlace:59872"
            gid:
              type: string
              example: "whosonfirst:address:NSR:GroupOfStopPlaces:1"
            layer:
              type: string
              enum: [venue, address]
              example: "venue"
            source:
              type: string
              enum: [openstreetmap, openaddresses, whosonfirst, geonames]
              example: "openstreetmap"
            source_id:
              type: string
              example: "NSR:StopPlace:59872"
            name:
              type: string
              example: "Oslo S"
            popular_name:
              type: string
              example: "Oslo Sentralstasjon"
            housenumber:
              type: string
              example: "42"
            street:
              type: string
              example: "Jernbanetorget"
            postalcode:
              type: string
              example: "0154"
            accuracy:
              type: string
              enum: [point, polygon]
              example: "point"
            country_a:
              type: string
              example: "NOR"
            county:
              type: string
              example: "Oslo"
            county_gid:
              type: string
              example: "whosonfirst:county:KVE:TopographicPlace:03"
            locality:
              type: string
              example: "Oslo"
            locality_gid:
              type: string
              example: "whosonfirst:locality:KVE:TopographicPlace:0301"
            borough:
              type: string
              example: "Sentrum"
            borough_gid:
              type: string
              example: "whosonfirst:borough:34200502"
            label:
              type: string
              example: "Oslo S, Oslo"
            category:
              type: array
              items:
                type: string
              example: ["street"]
            mode:
              type: array
              description: Transport modes for stop places. Each entry is a single-key object mapping a mode to its submode (or null when the mode has no submode).
              items:
                type: object
                additionalProperties:
                  type: string
                  nullable: true
              example: [{"bus": "railReplacementBus"}]
            tariff_zones:
              type: array
              items:
                type: string
              example: ["RUT:TariffZone:1"]
            distance:
              type: number
              format: double
              example: 123.45
